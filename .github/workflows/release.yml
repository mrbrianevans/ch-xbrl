# Build multi-platform CLI binaries and attach them to a GitHub Release.
#
# Trigger: create a semver release in the GitHub UI (Releases → Draft a new release).
# Tag format: vMAJOR.MINOR.PATCH (optional pre-release / build metadata, e.g. v1.2.0-rc.1).
#
# Platforms: linux/darwin/windows × amd64/arm64 (no wasm).
# Assets: the ch-xbrl executable for each platform (not wrapped in a zip or tar),
# concepts.csv, LICENSE, and SHA256SUMS.
name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate semver tag
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          # SemVer 2.0 with required leading "v" (vMAJOR.MINOR.PATCH + optional pre-release/build).
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not valid semver. Use e.g. v1.0.0 or v1.2.0-rc.1"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "Building release $tag for ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Build ch-xbrl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          sha="${GITHUB_SHA:0:7}"
          echo "Building ch-xbrl for ${GOOS}/${GOARCH}..."
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${sha}" \
            -o "dist/ch-xbrl${ext}" ./cmd/ch-xbrl
          ls -la dist/

      - name: Name executables
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          stem="${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p packages
          cp "dist/ch-xbrl${ext}" "packages/ch-xbrl_${stem}${ext}"
          ls -la packages/

      - name: Upload platform artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ch-xbrl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  concepts:
    name: Concept lookup CSV
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache taxonomy zips
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ch-xbrl-taxonomy
          key: taxonomy-${{ hashFiles('internal/taxonomy/sources.go') }}

      - name: Build concepts.csv
        run: go run ./cmd/taxonomy -o taxonomy-out

      - name: Upload concepts.csv
        uses: actions/upload-artifact@v7.0.2
        with:
          name: concepts-csv
          path: taxonomy-out/concepts.csv
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets to release
    needs: [build, concepts]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          files=(ch-xbrl_v* concepts.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release executables found"
            exit 1
          fi
          ls -la "${files[@]}"
          sha256sum "${files[@]}" | tee SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/ch-xbrl_v*
            artifacts/concepts.csv
            artifacts/SHA256SUMS
            LICENSE
          fail_on_unmatched_files: true
