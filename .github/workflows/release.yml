# Build multi-platform CLI binaries and attach them to a GitHub Release.
#
# Trigger: create a semver release in the GitHub UI (Releases → Draft a new release).
# Tag format: vMAJOR.MINOR.PATCH (optional pre-release / build metadata, e.g. v1.2.0-rc.1).
#
# Platforms: linux/darwin/windows × amd64/arm64 (no wasm).
# Assets: one executable per tool per platform (not wrapped in a zip or tar),
# concepts.csv from the pinned taxonomy list, LICENSE, and SHA256SUMS.
name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate semver tag
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          # SemVer 2.0 with required leading "v" (vMAJOR.MINOR.PATCH + optional pre-release/build).
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not valid semver. Use e.g. v1.0.0 or v1.2.0-rc.1"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "Building release $tag for ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          # name | package path
          builds=(
            "ch-xbrl:./cmd/ch-xbrl"
            "ch-xbrl-taxonomy:./cmd/taxonomy"
            "ch-xbrl-mksample:./cmd/mksample"
          )
          sha="${GITHUB_SHA:0:7}"
          for entry in "${builds[@]}"; do
            name="${entry%%:*}"
            pkg="${entry#*:}"
            echo "Building $name for ${GOOS}/${GOARCH}..."
            ldflags="-s -w"
            if [ "$name" = "ch-xbrl" ]; then
              ldflags="${ldflags} -X main.version=${VERSION} -X main.commit=${sha}"
            fi
            go build -trimpath -ldflags="${ldflags}" \
              -o "dist/${name}${ext}" "$pkg"
          done
          ls -la dist/

      - name: Name executables
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          stem="${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p packages
          cp "dist/ch-xbrl${ext}" "packages/ch-xbrl_${stem}${ext}"
          cp "dist/ch-xbrl-taxonomy${ext}" "packages/ch-xbrl-taxonomy_${stem}${ext}"
          cp "dist/ch-xbrl-mksample${ext}" "packages/ch-xbrl-mksample_${stem}${ext}"
          ls -la packages/

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ch-xbrl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: packages/*
          if-no-files-found: error
          retention-days: 7

  concepts:
    name: Concept lookup CSV
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache taxonomy zips
        uses: actions/cache@v4
        with:
          path: ~/.cache/ch-xbrl-taxonomy
          key: taxonomy-${{ hashFiles('internal/taxonomy/sources.go') }}

      - name: Build concepts.csv
        run: go run ./cmd/taxonomy -o concepts.csv

      - name: Upload concepts.csv
        uses: actions/upload-artifact@v4
        with:
          name: concepts-csv
          path: concepts.csv
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets to release
    needs: [build, concepts]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          files=(ch-xbrl_* ch-xbrl-taxonomy_* ch-xbrl-mksample_* concepts.csv)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release executables found"
            exit 1
          fi
          ls -la "${files[@]}"
          sha256sum "${files[@]}" | tee SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            artifacts/ch-xbrl_*
            artifacts/ch-xbrl-taxonomy_*
            artifacts/ch-xbrl-mksample_*
            artifacts/concepts.csv
            artifacts/SHA256SUMS
            LICENSE
          fail_on_unmatched_files: true
