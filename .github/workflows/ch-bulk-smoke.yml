# Live smoke: yesterday's Companies House Accounts_Bulk_Data zip via ch-xbrl.
#
# Cron is UTC. "Yesterday" is Europe/London. Missing objects (weekends / bank
# holidays) are HTTP 404 and the job succeeds without extracting.
# The zip is streamed with HTTP ranges; it is never saved or uploaded.
name: CH bulk smoke

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Bulk date YYYY-MM-DD (default: yesterday Europe/London)"
        required: false
        type: string

concurrency:
  group: ch-bulk-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Yesterday's Accounts_Bulk_Data
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Probe bulk zip
        id: bulk
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            day="$INPUT_DATE"
          else
            day="$(TZ=Europe/London date -d 'yesterday' +%F)"
          fi
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got '$day'"
            exit 2
          fi
          url="https://download.companieshouse.gov.uk/Accounts_Bulk_Data-${day}.zip"
          {
            echo "day=$day"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Probing $url"

          code="000"
          for i in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -L -I --max-time 60 "$url" || echo 000)"
            case "$code" in
              403|405)
                code="$(curl -sS -o /dev/null -w '%{http_code}' -L -r 0-0 --max-time 60 "$url" || echo 000)"
                ;;
            esac
            case "$code" in
              200|206|404) break ;;
            esac
            echo "probe attempt $i: HTTP $code, retrying..."
            sleep $((i * 2))
          done
          echo "HTTP $code"

          if [ "$code" = "404" ]; then
            echo "::notice::No bulk zip for $day (weekend or bank holiday). Skipping extract."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "::error::unexpected HTTP $code for $url"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ success() && steps.bulk.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ success() && steps.bulk.outputs.skip != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ch-xbrl
        if: ${{ success() && steps.bulk.outputs.skip != 'true' }}
        run: go build -o /tmp/ch-xbrl ./cmd/ch-xbrl

      - name: Extract (exit 0 required)
        if: ${{ success() && steps.bulk.outputs.skip != 'true' }}
        env:
          BULK_URL: ${{ steps.bulk.outputs.url }}
        run: |
          set -euo pipefail
          out=/tmp/ch-xbrl-bulk-smoke.csv
          echo "ch-xbrl -o $out -workers 4 $BULK_URL"
          /tmp/ch-xbrl -o "$out" -workers 4 "$BULK_URL"
          echo "facts.csv bytes=$(wc -c < "$out") lines=$(wc -l < "$out")"
          # Zip is never stored; CSV is runner-local only (no artefacts).
