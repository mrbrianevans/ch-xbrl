# General Go CI: format, vet/lint, test, build — every push/PR on every branch.
name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Format · Vet · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo ""
            echo "Run: gofmt -w ."
            exit 1
          fi
          echo "gofmt: OK"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: |
          set -euo pipefail
          go build -ldflags="-X main.version=ci -X main.commit=testsha" -o /tmp/ch-xbrl ./cmd/ch-xbrl
          go build -o /tmp/ch-xbrl-taxonomy ./cmd/taxonomy
          go build -o /tmp/ch-xbrl-mksample ./cmd/mksample
          got="$(/tmp/ch-xbrl -V)"
          want="ch-xbrl ci (testsha)"
          if [ "$got" != "$want" ]; then
            echo "::error::-V printed '$got', want '$want'"
            exit 1
          fi
          got="$(/tmp/ch-xbrl --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::--version printed '$got', want '$want'"
            exit 1
          fi
