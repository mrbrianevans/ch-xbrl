# General Go CI: format, vet, staticcheck, test, build.
name: Go CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Format · Vet · Staticcheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting (gofmt)
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Test
        run: go test ./... -count=1 -race

      - name: Build
        run: |
          set -euo pipefail
          go build -ldflags="-X main.version=ci -X main.commit=testsha" -o /tmp/ch-xbrl ./cmd/ch-xbrl
          go build -o /tmp/ch-xbrl-taxonomy ./cmd/taxonomy
          go build -o /tmp/ch-xbrl-mksample ./cmd/mksample
          got="$(/tmp/ch-xbrl -V)"
          want="ch-xbrl ci (testsha)"
          if [ "$got" != "$want" ]; then
            echo "::error::-V printed '$got', want '$want'"
            exit 1
          fi
          got="$(/tmp/ch-xbrl --version)"
          if [ "$got" != "$want" ]; then
            echo "::error::--version printed '$got', want '$want'"
            exit 1
          fi

      - name: CLI invocation smoke
        run: |
          set -euo pipefail
          bin=/tmp/ch-xbrl
          xhtml=samples/03024914_aa_2023-03-13.xhtml
          out=/tmp/ch-xbrl-smoke
          mkdir -p "$out/dir/nested" "$out/tarin"
          cp "$xhtml" "$out/dir/"
          cp "$xhtml" "$out/tarin/"
          printf 'not xbrl\n' > "$out/dir/readme.txt"
          cp "$xhtml" "$out/dir/nested/hidden.xhtml"
          /tmp/ch-xbrl-mksample -dir "$out/tarin" -out "$out/sample.tar.zst"
          tar=$out/sample.tar.zst

          echo "local tar.zst"
          "$bin" -o "$out/tar.csv" -workers 1 "$tar"
          test -s "$out/tar.csv"

          echo "local zip"
          zip -j "$out/sample.zip" "$xhtml"
          "$bin" -o "$out/zip.csv" -workers 1 "$out/sample.zip"
          test -s "$out/zip.csv"

          echo "local instance"
          "$bin" -o "$out/xhtml.csv" -workers 1 "$xhtml"
          test -s "$out/xhtml.csv"

          echo "directory (top-level only)"
          "$bin" -o "$out/dir.csv" -workers 1 "$out/dir"
          test -s "$out/dir.csv"
          if grep -q hidden.xhtml "$out/dir.csv"; then
            echo "::error::directory smoke parsed a nested instance"
            exit 1
          fi

          echo "stdin XML"
          cat "$xhtml" | "$bin" -o "$out/stdin-xml.csv" -workers 1 -
          test -s "$out/stdin-xml.csv"

          echo "stdin tar.zst"
          cat "$tar" | "$bin" -o "$out/stdin-tar.csv" -workers 1 -
          test -s "$out/stdin-tar.csv"

          echo "missing positional → 2"
          set +e
          "$bin" -o "$out/missing.csv"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::missing input: want exit 2, got $code"
            exit 1
          fi

          echo "pipe without - → 2"
          set +e
          cat "$xhtml" | "$bin" -o "$out/nodash.csv"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::pipe without -: want exit 2, got $code"
            exit 1
          fi

          echo "stdin zip refused → 1"
          # ZIP local-file magic; zip from stdin is not supported (needs seek).
          printf 'PK\x03\x04' > "$out/tiny.zip"
          set +e
          cat "$out/tiny.zip" | "$bin" -o "$out/stdin-zip.csv" -
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::stdin zip: want exit 1, got $code"
            exit 1
          fi

          echo "help lists new inputs"
          set +e
          "$bin" -h >/dev/null 2>"$out/help.err"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::-h: want exit 0, got $code"
            exit 1
          fi
          if ! grep -q 'stdin' "$out/help.err" || ! grep -q '.xhtml' "$out/help.err"; then
            echo "::error::-h does not mention stdin / instance inputs"
            cat "$out/help.err"
            exit 1
          fi

      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/duckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip"
          mkdir -p "$HOME/.local/bin"
          unzip -o /tmp/duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/duckdb" --version

      - name: Input-method consistency (DuckDB)
        run: |
          set -euo pipefail
          bin=/tmp/ch-xbrl
          fx=/tmp/ch-xbrl-input-fx
          mkdir -p "$fx/dir"
          cp samples/03024914_aa_2023-03-13.xhtml "$fx/dir/"
          cp samples/Prod223_4203_00134794_20250927.html "$fx/dir/"

          zip -j "$fx/sample.zip" "$fx/dir"/*
          /tmp/ch-xbrl-mksample -dir "$fx/dir" -out "$fx/sample.tar.zst"

          echo "dir"
          "$bin" -o "$fx/dir.csv" -workers 2 "$fx/dir"
          echo "zip"
          "$bin" -o "$fx/zip.csv" -workers 2 "$fx/sample.zip"
          echo "tar.zst"
          "$bin" -o "$fx/tar.csv" -workers 2 "$fx/sample.tar.zst"
          echo "stdin tar.zst"
          "$bin" -o "$fx/stdin_tar.csv" -workers 2 - < "$fx/sample.tar.zst"

          for f in dir.csv zip.csv tar.csv stdin_tar.csv; do
            test -s "$fx/$f"
          done

          (cd "$fx" && duckdb -c ".read '${GITHUB_WORKSPACE}/sql/compare_input_methods.sql'")
